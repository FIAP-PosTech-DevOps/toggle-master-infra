# -----------------------------------------------------------------------------
# Botão "criar-release" (workflow reutilizável)
# -----------------------------------------------------------------------------
# Cada repositório (5 serviços + toggle-master-infra) tem um release.yml com
# `workflow_dispatch` — o botão da aba Actions — que chama este arquivo.
#
#   criar-release   cria release/vX.Y.Z a partir da main (patch/minor/major)
#
# Este workflow só mexe no Git. O resto do fluxo é feito por PR e merge:
#
#   feature/* --(botão "Run workflow" do ci)--> develop
#   feature/* --PR--> release/vX.Y.Z --push--> staging
#   release/vX.Y.Z --PR + merge--> main --> production (com aprovação)
#                                           + tag vX.Y.Z na main
#
# O push da branch nova usa o secret CI_GITHUB_TOKEN, e não o GITHUB_TOKEN:
# eventos criados com o GITHUB_TOKEN não disparam outros workflows (proteção
# do GitHub contra loops).
# -----------------------------------------------------------------------------
name: git-release

on:
  workflow_call:
    inputs:
      action:
        description: criar-release (única ação; o resto do fluxo é por PR)
        type: string
        default: criar-release
      bump:
        description: patch | minor | major
        type: string
        default: patch

# Nada por padrão; cada job pede só o que usa.
permissions: {}

jobs:
  release:
    name: ${{ inputs.action }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Conferir CI_GITHUB_TOKEN
        shell: bash
        env:
          TOKEN: ${{ secrets.CI_GITHUB_TOKEN }}
        run: |
          [[ -n "$TOKEN" ]] || { echo "::error::secret CI_GITHUB_TOKEN não configurado"; exit 1; }

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.CI_GITHUB_TOKEN }}

      - name: Executar
        shell: bash
        env:
          ACTION: ${{ inputs.action }}
          BUMP: ${{ inputs.bump }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          summary() { echo "$*" >> "$GITHUB_STEP_SUMMARY"; echo "$*"; }
          die() { echo "::error::$*" >&2; exit 1; }

          SEMVER='[0-9]+\.[0-9]+\.[0-9]+'

          case "$ACTION" in
            # -----------------------------------------------------------------
            criar-release)
              # Base: a maior versão entre as tags finais e as releases abertas.
              LAST_TAG="$(git tag -l 'v*' | grep -E "^v${SEMVER}$" | sort -V | tail -1 || true)"
              LAST_BRANCH="$(git branch -r --format='%(refname:short)' | grep -oE "release/v${SEMVER}$" | sed 's#release/##' | sort -V | tail -1 || true)"
              BASE="$(printf '%s\n%s\n' "${LAST_TAG:-v0.0.0}" "${LAST_BRANCH:-v0.0.0}" | sort -V | tail -1)"
              IFS=. read -r MAJOR MINOR PATCH <<< "${BASE#v}"
              case "$BUMP" in
                major) NEXT="$((MAJOR + 1)).0.0" ;;
                minor) NEXT="${MAJOR}.$((MINOR + 1)).0" ;;
                patch) NEXT="${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
                *) die "bump inválido: $BUMP" ;;
              esac
              BRANCH="release/v${NEXT}"
              git push origin "origin/main:refs/heads/${BRANCH}"
              summary "### Release criada: \`${BRANCH}\` (a partir da main, base ${BASE}, ${BUMP})"
              summary "Próximos passos: PRs de feature/* e fix/* para \`${BRANCH}\` (cada merge sobe em staging). Validado em staging, abra o PR \`${BRANCH}\` → main: o merge leva a versão para produção."
              ;;

            *)
              die "ação desconhecida: $ACTION (só existe criar-release)"
              ;;
          esac
