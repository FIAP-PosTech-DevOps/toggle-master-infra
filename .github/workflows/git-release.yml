# -----------------------------------------------------------------------------
# Botões de release (workflow reutilizável)
# -----------------------------------------------------------------------------
# Cada repositório (5 serviços + toggle-master-infra) tem um release.yml com
# `workflow_dispatch` — os "botões" da aba Actions — que chama este arquivo.
#
#   criar-release      cria release/vX.Y.Z a partir da main (patch/minor/major)
#   promover-staging   cria vX.Y.Z-rc.N no último commit da release
#   promover-producao  cria vX.Y.Z no commit do último rc (o que foi testado)
#
# Este workflow só mexe no Git. Quem age é o push resultante:
#   branch release/*  ->  ci.yml (build, scans, ECR, develop)
#   tag -rc / final   ->  promote.yml (serviços) | terraform.yml (infra)
#
# Por isso o push usa o secret CI_GITHUB_TOKEN, e não o GITHUB_TOKEN: eventos
# criados com o GITHUB_TOKEN não disparam outros workflows (proteção do
# GitHub contra loops), e a promoção nunca aconteceria.
# -----------------------------------------------------------------------------
name: git-release

on:
  workflow_call:
    inputs:
      action:
        description: criar-release | promover-staging | promover-producao
        type: string
        required: true
      bump:
        description: patch | minor | major (só para criar-release)
        type: string
        default: patch
      release:
        description: "Branch da release (ex.: release/v1.2.0). Vazio = a mais recente."
        type: string
        default: ""

# Nada por padrão; cada job pede só o que usa.
permissions: {}

jobs:
  release:
    name: ${{ inputs.action }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Conferir CI_GITHUB_TOKEN
        shell: bash
        env:
          TOKEN: ${{ secrets.CI_GITHUB_TOKEN }}
        run: |
          [[ -n "$TOKEN" ]] || { echo "::error::secret CI_GITHUB_TOKEN não configurado"; exit 1; }

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.CI_GITHUB_TOKEN }}

      - name: Executar
        shell: bash
        env:
          ACTION: ${{ inputs.action }}
          BUMP: ${{ inputs.bump }}
          RELEASE_INPUT: ${{ inputs.release }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          summary() { echo "$*" >> "$GITHUB_STEP_SUMMARY"; echo "$*"; }
          die() { echo "::error::$*" >&2; exit 1; }

          SEMVER='[0-9]+\.[0-9]+\.[0-9]+'

          # Release em andamento: a informada, ou a de maior versão.
          current_release() {
            if [[ -n "$RELEASE_INPUT" ]]; then
              git show-ref --verify --quiet "refs/remotes/origin/${RELEASE_INPUT}" \
                || die "branch ${RELEASE_INPUT} não existe"
              echo "$RELEASE_INPUT"
            else
              git branch -r --format='%(refname:short)' \
                | grep -oE "release/v${SEMVER}$" | sort -V | tail -1 || true
            fi
          }

          case "$ACTION" in
            # -----------------------------------------------------------------
            criar-release)
              # Base: a maior versão entre as tags finais e as releases abertas.
              LAST_TAG="$(git tag -l 'v*' | grep -E "^v${SEMVER}$" | sort -V | tail -1 || true)"
              LAST_BRANCH="$(git branch -r --format='%(refname:short)' | grep -oE "release/v${SEMVER}$" | sed 's#release/##' | sort -V | tail -1 || true)"
              BASE="$(printf '%s\n%s\n' "${LAST_TAG:-v0.0.0}" "${LAST_BRANCH:-v0.0.0}" | sort -V | tail -1)"
              IFS=. read -r MAJOR MINOR PATCH <<< "${BASE#v}"
              case "$BUMP" in
                major) NEXT="$((MAJOR + 1)).0.0" ;;
                minor) NEXT="${MAJOR}.$((MINOR + 1)).0" ;;
                patch) NEXT="${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
                *) die "bump inválido: $BUMP" ;;
              esac
              BRANCH="release/v${NEXT}"
              git push origin "origin/main:refs/heads/${BRANCH}"
              summary "### Release criada: \`${BRANCH}\` (a partir da main, base ${BASE}, ${BUMP})"
              summary "Próximos passos: PRs de feature/* e fix/* para \`${BRANCH}\`. Cada push nela vai para develop."
              ;;

            # -----------------------------------------------------------------
            promover-staging)
              BRANCH="$(current_release)"
              [[ -n "$BRANCH" ]] || die "nenhuma release aberta. Use criar-release primeiro."
              VERSION="${BRANCH#release/v}"
              git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null \
                && die "v${VERSION} já foi para produção; crie uma nova release"

              COMMIT="$(git rev-parse "origin/${BRANCH}")"
              EXISTING="$(git tag --points-at "$COMMIT" | grep -E "^v${VERSION}-rc\.[0-9]+$" || true)"
              [[ -z "$EXISTING" ]] || die "o último commit de ${BRANCH} já é ${EXISTING}. Faça um novo commit na release ou promova para produção."

              LAST_RC="$(git tag -l "v${VERSION}-rc.*" | sed -E 's/.*-rc\.//' | sort -n | tail -1 || true)"
              TAG="v${VERSION}-rc.$(( ${LAST_RC:-0} + 1 ))"
              git tag -a "$TAG" "$COMMIT" -m "${TAG}: candidata para staging (por ${ACTOR})"
              git push origin "refs/tags/${TAG}"
              summary "### \`${TAG}\` criada em ${BRANCH} (${COMMIT:0:7}) → staging"
              ;;

            # -----------------------------------------------------------------
            promover-producao)
              BRANCH="$(current_release)"
              [[ -n "$BRANCH" ]] || die "nenhuma release aberta."
              VERSION="${BRANCH#release/v}"
              git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null \
                && die "v${VERSION} já existe"

              RC="$(git tag -l "v${VERSION}-rc.*" | sort -V | tail -1 || true)"
              [[ -n "$RC" ]] || die "nenhum rc de v${VERSION}. Promova para staging antes."
              COMMIT="$(git rev-list -n 1 "$RC")"

              # Vai para produção exatamente o que foi validado em staging.
              HEAD_COMMIT="$(git rev-parse "origin/${BRANCH}")"
              if [[ "$HEAD_COMMIT" != "$COMMIT" ]]; then
                echo "::warning::${BRANCH} tem commits depois de ${RC}; eles NÃO vão para produção nesta versão."
              fi

              TAG="v${VERSION}"
              git tag -a "$TAG" "$COMMIT" -m "${TAG}: produção, a partir de ${RC} (por ${ACTOR})"
              git push origin "refs/tags/${TAG}"
              summary "### \`${TAG}\` criada no commit de \`${RC}\` (${COMMIT:0:7}) → production"
              ;;

            *)
              die "ação desconhecida: $ACTION"
              ;;
          esac
