# -----------------------------------------------------------------------------
# Promoção para production (workflow reutilizável)
# -----------------------------------------------------------------------------
# Disparado quando um PR release/vX.Y.Z -> main é MERGEADO no repositório do
# serviço (promote.yml). A main passa a ser o que está em produção.
#
# NÃO há novo build: vai para produção a mesma imagem vX.Y.Z-<sha> que foi
# construída no último push da release e está rodando em staging. Antes de
# promover, o job confere três coisas:
#
#   1. a imagem existe no ECR;
#   2. é a mesma que está no overlay de staging (produção só recebe o que foi
#      validado em staging);
#   3. continua sem vulnerabilidade CRÍTICA (re-scan do Trivy: uma CVE nova,
#      descoberta depois do build, também barra a promoção).
#
# Depois da aprovação no GitHub Environment "production", atualiza o overlay
# de production no GitOps e cria a tag vX.Y.Z no commit da main.
#
# O SHA vem do PR (head.sha), e não do commit novo da main: com "Squash and
# merge" o commit da main é outro, mas a imagem foi construída a partir do
# último commit da release.
# -----------------------------------------------------------------------------
name: service-promote

on:
  workflow_call:
    inputs:
      service-name:
        type: string
        required: true
      aws-account-id:
        type: string
        required: true
      ecr-region:
        type: string
        default: us-east-1
      gitops-repository:
        type: string
        default: FIAP-PosTech-DevOps/toggle-master-gitops

# Nada por padrão; cada job pede só o que usa.
permissions: {}

env:
  TRIVY_VERSION: v0.75.0

jobs:
  # ---------------------------------------------------------------------------
  # Qual versão, qual imagem, e se o PR respeita o fluxo
  # ---------------------------------------------------------------------------
  resolve:
    name: Validar o merge
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      version: ${{ steps.r.outputs.version }}
      image-tag: ${{ steps.r.outputs.image-tag }}
    steps:
      - id: r
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          MERGED: ${{ github.event.pull_request.merged }}
          BASE: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$EVENT" == "pull_request" && "$MERGED" == "true" && "$BASE" == "main" ]] \
            || { echo "::error::este workflow só roda no merge de um PR para a main"; exit 1; }
          [[ "$HEAD_REF" =~ ^release/v([0-9]+\.[0-9]+\.[0-9]+)$ ]] \
            || { echo "::error::só uma release/vX.Y.Z vai para produção (PR veio de $HEAD_REF)"; exit 1; }
          VERSION="${BASH_REMATCH[1]}"
          IMAGE_TAG="v${VERSION}-${HEAD_SHA:0:7}"
          {
            echo "version=$VERSION"
            echo "image-tag=$IMAGE_TAG"
          } >> "$GITHUB_OUTPUT"
          echo "### ${{ inputs.service-name }}: \`$HEAD_REF\` → **production** (imagem \`$IMAGE_TAG\`)" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Aprovação, conferências, GitOps e tag — tudo no Environment production
  # ---------------------------------------------------------------------------
  # Um job só: cada job que usa um Environment protegido pede uma aprovação
  # separada. O job fica parado aqui até alguém aprovar (Settings >
  # Environments > production > Required reviewers); só depois as
  # conferências rodam, então elas refletem o estado do momento do deploy.
  promote:
    name: GitOps — production
    needs: resolve
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write # cria a tag vX.Y.Z na main
      id-token: write # OIDC com a AWS para conferir a imagem no ECR
    concurrency:
      group: gitops-${{ inputs.service-name }}-production
      cancel-in-progress: false
    env:
      IMAGE: ${{ inputs.aws-account-id }}.dkr.ecr.${{ inputs.ecr-region }}.amazonaws.com/togglemaster/${{ inputs.service-name }}
      IMAGE_TAG: ${{ needs.resolve.outputs.image-tag }}
      VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - name: Conferir CI_GITHUB_TOKEN
        shell: bash
        env:
          TOKEN: ${{ secrets.CI_GITHUB_TOKEN }}
        run: |
          [[ -n "$TOKEN" ]] || { echo "::error::secret CI_GITHUB_TOKEN não configurado (escrita no repositório GitOps)"; exit 1; }

      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ inputs.aws-account-id }}:role/togglemaster-gha-ecr-push
          aws-region: ${{ inputs.ecr-region }}

      - name: 1. A imagem existe no ECR?
        shell: bash
        env:
          REPOSITORY: togglemaster/${{ inputs.service-name }}
          REGION: ${{ inputs.ecr-region }}
        run: |
          aws ecr describe-images --region "$REGION" --repository-name "$REPOSITORY" \
              --image-ids imageTag="$IMAGE_TAG" >/dev/null \
            || { echo "::error::${IMAGE}:${IMAGE_TAG} não existe no ECR. O último commit da release passou pela pipeline (push em release/v${VERSION})?"; exit 1; }

      - name: Ler o overlay de staging no GitOps
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.gitops-repository }}
          token: ${{ secrets.CI_GITHUB_TOKEN }}
          ref: main
          path: .gitops-staging
          sparse-checkout: apps/${{ inputs.service-name }}/overlays/staging

      - name: 2. É a mesma imagem que está em staging?
        shell: bash
        env:
          SERVICE: ${{ inputs.service-name }}
        run: |
          FILE=".gitops-staging/apps/${SERVICE}/overlays/staging/kustomization.yaml"
          STAGING="$(yq '(.images[] | select(.name == strenv(SERVICE))).newTag' "$FILE")"
          if [[ "$STAGING" != "$IMAGE_TAG" ]]; then
            echo "::error::staging está com $STAGING, mas o merge levaria $IMAGE_TAG para produção. Espere a pipeline da release terminar (ou rode-a de novo) e valide em staging antes do merge."
            exit 1
          fi
          echo "- validada em staging: \`$STAGING\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: aws-actions/amazon-ecr-login@v2.1.7

      - name: 3. trivy image (CRÍTICA reprova)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
          scanners: vuln
          severity: CRITICAL
          exit-code: "1"
          format: table

      - uses: FIAP-PosTech-DevOps/toggle-master-infra/.github/actions/gitops-set-image@main
        with:
          service: ${{ inputs.service-name }}
          environment: production
          image-tag: ${{ env.IMAGE_TAG }}
          repository: ${{ inputs.gitops-repository }}
          token: ${{ secrets.CI_GITHUB_TOKEN }}

      # A tag marca na main o commit que foi para produção. Criada com o
      # GITHUB_TOKEN de propósito: eventos dele não disparam outros workflows.
      - name: Criar a tag vX.Y.Z na main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          TAG="v${VERSION}"
          if gh api "repos/${REPO}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "::notice::a tag ${TAG} já existe"
          else
            gh api "repos/${REPO}/git/refs" -f ref="refs/tags/${TAG}" -f sha="$MERGE_SHA" >/dev/null
            echo "- tag \`${TAG}\` criada em \`${MERGE_SHA:0:7}\` (main)" >> "$GITHUB_STEP_SUMMARY"
          fi
