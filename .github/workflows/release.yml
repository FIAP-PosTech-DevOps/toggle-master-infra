# Botão de release do repositório de infraestrutura (aba Actions > release >
# Run workflow). A lógica fica em git-release.yml, a mesma dos serviços.
#
# Depois de criada a release, o terraform.yml faz o resto:
#   botão "Run workflow" (qualquer branch) -> apply em develop
#   push em release/*                      -> apply em staging
#   merge do PR release/* -> main          -> apply em production (com aprovação)
name: release

on:
  workflow_dispatch:
    inputs:
      tipo-de-versao:
        description: "patch (correção), minor (funcionalidade), major (quebra de contrato)"
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: read

jobs:
  release:
    uses: ./.github/workflows/git-release.yml
    with:
      action: criar-release
      bump: ${{ inputs.tipo-de-versao }}
    secrets: inherit
