# -----------------------------------------------------------------------------
# Pipeline do Terraform
# -----------------------------------------------------------------------------
# Estratégia de ambientes (a mesma dos microsserviços):
#
#   botão "Run workflow", qualquer branch  -->  develop (plan, apply ou destroy)
#   feature/*, fix/*  --PR-->  release/vX.Y.Z  --push-->  apply em staging
#   release/vX.Y.Z    --PR + merge-->  main     -->  apply em production
#                                                   (aprovação no Environment)
#
# A main é o que está em produção. Cancelar um pacote = abandonar a release,
# sem desfazer nada na main. O develop é compartilhado: vale o último apply.
#
# Branches só disparam quando algo em terraform/ (ou este arquivo) muda: um
# commit de documentação não gera plan nem apply.
#
#   Pull request -> validação estática + plan do ambiente de destino
#                   (PR para release/* = staging; PR para a main = production)
#   Push         -> validação + plan + apply (release/* = staging; main = production)
#   Manual       -> plan, apply ou destroy. apply em staging só a partir de
#                   uma release/*, e em production só a partir da main;
#                   destroy de qualquer ambiente a partir de qualquer branch.
#
# Pré-requisitos (uma vez, ver terraform/README.md):
#   - stacks bootstrap e global aplicados localmente
#   - variável de repositório AWS_ACCOUNT_ID
#   - GitHub Environments develop, staging e production (production com
#     "Required reviewers" para exigir aprovação antes do apply)
# -----------------------------------------------------------------------------
name: terraform

on:
  pull_request:
    branches: ["release/**", main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: ["release/**", main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Ambiente"
        type: choice
        options: [develop, staging, production]
        required: true
      action:
        description: "O que fazer"
        type: choice
        options: [plan, apply, destroy]
        default: plan
        required: true

permissions:
  contents: read
  id-token: write  # OIDC: troca o token do GitHub por credenciais temporárias da AWS

env:
  TF_VERSION: "~1.16"
  AWS_REGION: us-east-1  # região do bucket de state; cada ambiente usa a sua via tfvars
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  # ---------------------------------------------------------------------------
  # Qual ambiente este evento afeta?
  # ---------------------------------------------------------------------------
  resolve:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      action: ${{ steps.env.outputs.action }}
    steps:
      - id: env
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          BASE_REF: ${{ github.base_ref }}
          CREATED: ${{ github.event.created }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          INPUT_ACTION: ${{ inputs.action }}
        run: |
          die() { echo "::error::$*"; exit 1; }
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            ENVIRONMENT="$INPUT_ENVIRONMENT"
            ACTION="$INPUT_ACTION"
            # develop aceita qualquer branch. staging e production só recebem
            # apply do código que passou pelo fluxo (release e main).
            if [[ "$ACTION" == "apply" ]]; then
              case "$ENVIRONMENT" in
                staging)    [[ "$REF_NAME" =~ ^release/v ]] || die "apply em staging só a partir de uma release/* (escolhida: $REF_NAME)" ;;
                production) [[ "$REF_NAME" == "main" ]]    || die "apply em production só a partir da main (escolhida: $REF_NAME)" ;;
              esac
            fi
          elif [[ "$EVENT" == "pull_request" ]]; then
            # Em PR vale a branch de DESTINO, e só roda plan.
            ACTION=plan
            case "$BASE_REF" in
              release/*) ENVIRONMENT=staging ;;
              main)      ENVIRONMENT=production ;;
              *) die "PR para branch sem ambiente: $BASE_REF" ;;
            esac
          elif [[ "$REF_NAME" == "main" ]]; then
            # Merge do PR release -> main: a versão vai para produção.
            ACTION=apply
            ENVIRONMENT=production
          elif [[ "$CREATED" == "true" ]]; then
            # Branch release/* recém-criada pelo botão criar-release: ela é
            # uma cópia da main (= produção), então não há nada novo para
            # aplicar. Sem este caso, criar a release subiria o staging antes
            # de qualquer demanda entrar no pacote.
            ACTION=none
            ENVIRONMENT=staging
            echo "release criada a partir da main: nada a aplicar" >> "$GITHUB_STEP_SUMMARY"
          else
            # push em release/* (merge de um PR no pacote)
            ACTION=apply
            ENVIRONMENT=staging
          fi
          echo "environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"
          echo "action=$ACTION" >> "$GITHUB_OUTPUT"
          echo "### Ambiente: \`$ENVIRONMENT\` · ação: \`$ACTION\` · branch: \`$REF_NAME\`" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Validação estática: não precisa de credencial AWS
  # ---------------------------------------------------------------------------
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff terraform

      - name: terraform validate (todos os stacks)
        shell: bash
        run: |
          for stack in bootstrap global infra cluster-addons; do
            echo "::group::$stack"
            terraform -chdir="terraform/$stack" init -backend=false -input=false >/dev/null
            terraform -chdir="terraform/$stack" validate
            echo "::endgroup::"
          done

      - uses: terraform-linters/setup-tflint@v6.3.2

      - name: tflint
        run: tflint --recursive --chdir=terraform --minimum-failure-severity=error

      # SAST de IaC. Os achados aceitos conscientemente estão listados, com
      # motivo, em terraform/.checkov.yaml; qualquer outro reprova o PR.
      - name: checkov
        uses: bridgecrewio/checkov-action@v12.3128.0
        with:
          directory: terraform
          framework: terraform
          config_file: terraform/.checkov.yaml
          quiet: true

  # ---------------------------------------------------------------------------
  # Plan (role somente leitura)
  # ---------------------------------------------------------------------------
  plan:
    needs: [resolve, static]
    if: needs.resolve.outputs.action == 'plan' || needs.resolve.outputs.action == 'apply'
    runs-on: ubuntu-latest
    concurrency:
      group: terraform-${{ needs.resolve.outputs.environment }}
      cancel-in-progress: false
    env:
      ENVIRONMENT: ${{ needs.resolve.outputs.environment }}
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/togglemaster-gha-terraform-plan
          aws-region: ${{ env.AWS_REGION }}

      - name: plan infra
        shell: bash
        run: |
          set -o pipefail
          ./terraform/tf.sh infra "$ENVIRONMENT" plan -no-color -lock-timeout=5m | tee infra-plan.txt
          {
            echo "<details><summary>plan infra ($ENVIRONMENT)</summary>"
            echo; echo '```'; tail -c 60000 infra-plan.txt; echo '```'; echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      # O cluster-addons lê o cluster (data source) já no plan. Se o cluster
      # ainda não existe, o plan dele só faz sentido depois do apply do infra.
      - name: plan cluster-addons
        shell: bash
        run: |
          set -o pipefail
          REGION="$(grep -E '^aws_region' "terraform/infra/envs/$ENVIRONMENT.tfvars" | cut -d'"' -f2)"
          if ! aws eks describe-cluster --region "$REGION" --name "togglemaster-$ENVIRONMENT-cluster" >/dev/null 2>&1; then
            echo "cluster ainda não existe — plan do cluster-addons fica para depois do apply do infra" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          ./terraform/tf.sh cluster-addons "$ENVIRONMENT" plan -no-color -lock-timeout=5m | tee addons-plan.txt
          {
            echo "<details><summary>plan cluster-addons ($ENVIRONMENT)</summary>"
            echo; echo '```'; tail -c 60000 addons-plan.txt; echo '```'; echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Apply (role admin, só dentro de um GitHub Environment)
  # ---------------------------------------------------------------------------
  apply:
    needs: [resolve, plan]
    if: needs.resolve.outputs.action == 'apply'
    runs-on: ubuntu-latest
    # O environment é o que libera a role de apply (trust policy) e é onde o
    # GitHub aplica a regra de aprovação manual de production.
    environment: ${{ needs.resolve.outputs.environment }}
    permissions:
      contents: write # tag vX.Y.Z na main depois do apply em production
      id-token: write
    concurrency:
      group: terraform-${{ needs.resolve.outputs.environment }}
      cancel-in-progress: false
    env:
      ENVIRONMENT: ${{ needs.resolve.outputs.environment }}
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/togglemaster-gha-terraform-apply
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 7200

      - name: apply infra
        run: ./terraform/tf.sh infra "$ENVIRONMENT" apply -auto-approve -no-color -lock-timeout=5m

      - name: apply cluster-addons
        run: ./terraform/tf.sh cluster-addons "$ENVIRONMENT" apply -auto-approve -no-color -lock-timeout=5m

      # Inicializa o OpenBao (só na primeira vez) e grava os segredos da
      # aplicação. É idempotente: num ambiente já existente só confere a
      # configuração e preserva MASTER_KEY e SERVICE_API_KEY. Nenhum valor
      # sensível vai para o log (root token e chaves ficam no Secrets Manager).
      - name: openbao-bootstrap
        run: ./scripts/openbao-bootstrap.sh "$ENVIRONMENT"

      # Merge release/vX.Y.Z -> main aplicado em produção: marca a versão na
      # main. A versão vem do PR que gerou o commit (funciona com squash).
      - name: tag vX.Y.Z na main
        if: env.ENVIRONMENT == 'production' && github.event_name == 'push' && github.ref_name == 'main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          HEAD_REF="$(gh api "repos/${REPO}/commits/${SHA}/pulls" --jq '[.[] | select(.base.ref == "main")][0].head.ref // ""')"
          if [[ ! "$HEAD_REF" =~ ^release/v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::notice::commit da main não veio de um PR de release (${HEAD_REF:-sem PR}); sem tag"
            exit 0
          fi
          TAG="v${BASH_REMATCH[1]}"
          if gh api "repos/${REPO}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "::notice::a tag ${TAG} já existe"
          else
            gh api "repos/${REPO}/git/refs" -f ref="refs/tags/${TAG}" -f sha="$SHA" >/dev/null
            echo "- tag \`${TAG}\` criada em \`${SHA:0:7}\` (main)" >> "$GITHUB_STEP_SUMMARY"
          fi

  # ---------------------------------------------------------------------------
  # Destroy (manual) — desliga o ambiente ao fim da sessão para não pagar
  # ---------------------------------------------------------------------------
  destroy:
    needs: [resolve, static]
    if: needs.resolve.outputs.action == 'destroy'
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve.outputs.environment }}
    concurrency:
      group: terraform-${{ needs.resolve.outputs.environment }}
      cancel-in-progress: false
    env:
      ENVIRONMENT: ${{ needs.resolve.outputs.environment }}
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/togglemaster-gha-terraform-apply
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 7200

      # Região do ambiente (o AWS_REGION do job é a do bucket de state).
      - name: região e VPC do ambiente
        run: |
          REGION="$(sed -nE 's/^aws_region *= *"([^"]+)".*/\1/p' "terraform/infra/envs/$ENVIRONMENT.tfvars")"
          [[ -n "$REGION" ]] || { echo "::error::aws_region não encontrado em envs/$ENVIRONMENT.tfvars"; exit 1; }
          VPC_ID="$(./terraform/tf.sh infra "$ENVIRONMENT" output -raw vpc_id 2>/dev/null || true)"
          echo "ENV_REGION=$REGION" >> "$GITHUB_ENV"
          echo "VPC_ID=$VPC_ID" >> "$GITHUB_ENV"

      # Antes de remover os addons, esvazia os objetos dos operadores que
      # têm "finalizer" (KEDA e External Secrets). Se o operador sai antes
      # deles, ninguém solta a trava, o CRD fica preso em Terminating e o
      # `helm uninstall` estoura o tempo ("context deadline exceeded"). Já
      # aconteceu com o ScaledObject do analytics (KEDA) e com os
      # ExternalSecret/ClusterSecretStore (External Secrets).
      - name: esvaziar o cluster (ArgoCD, KEDA e External Secrets)
        shell: bash
        run: |
          CLUSTER="togglemaster-$ENVIRONMENT-cluster"
          if ! aws eks describe-cluster --region "$ENV_REGION" --name "$CLUSTER" >/dev/null 2>&1; then
            echo "cluster $CLUSTER não existe: nada a esvaziar"
            exit 0
          fi
          aws eks update-kubeconfig --region "$ENV_REGION" --name "$CLUSTER" >/dev/null

          # 1. O ArgoCD para de reconciliar; senão recria o que for apagado.
          kubectl -n argocd scale statefulset argocd-application-controller --replicas=0 2>/dev/null \
            || echo "ArgoCD não encontrado"

          # Todos os tipos (CRDs) dos dois operadores que existirem no cluster.
          TYPES=()
          for group in keda.sh external-secrets.io; do
            while read -r t; do [[ -n "$t" ]] && TYPES+=("$t"); done \
              < <(kubectl api-resources --api-group="$group" -o name 2>/dev/null)
          done
          echo "tipos encontrados: ${TYPES[*]:-nenhum}"

          # 2. Apaga os objetos com os operadores ainda vivos: eles mesmos
          #    soltam a trava e o objeto sai normalmente.
          for r in "${TYPES[@]}"; do
            kubectl delete "$r" --all -A --wait=true --timeout=120s || true
          done

          # 3. Se algum ficou preso (operador fora do ar), solta a trava à
          #    força. O webhook do External Secrets pode recusar o patch se o
          #    pod dele já saiu; sem o operador, ele não tem mais o que validar.
          kubectl delete validatingwebhookconfiguration secretstore-validate externalsecret-validate \
            --ignore-not-found >/dev/null 2>&1 || true
          for r in "${TYPES[@]}"; do
            kubectl get "$r" -A -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.metadata.namespace}{"\n"}{end}' 2>/dev/null \
              | while read -r name ns; do
                  [[ -n "$name" ]] || continue
                  echo "removendo o finalizer de $r ${ns:+$ns/}$name"
                  if [[ -n "$ns" ]]; then
                    kubectl -n "$ns" patch "$r" "$name" --type merge -p '{"metadata":{"finalizers":null}}'
                  else
                    kubectl patch "$r" "$name" --type merge -p '{"metadata":{"finalizers":null}}'
                  fi
                done
          done
          # 4. Applications do ArgoCD: com o controller parado (passo 1),
          #    ninguém processa o finalizer resources-finalizer, e o helm
          #    uninstall do argocd-root-app esperava até estourar o timeout
          #    ("context deadline exceeded"). O cluster vai ser destruído,
          #    então a exclusão em cascata não é necessária: solta a trava.
          kubectl get applications.argoproj.io -A \
              -o jsonpath='{range .items[*]}{.metadata.namespace}{" "}{.metadata.name}{"\n"}{end}' 2>/dev/null \
            | while read -r ns name; do
                [[ -n "$name" ]] || continue
                echo "removendo o finalizer da Application $ns/$name"
                kubectl -n "$ns" patch applications.argoproj.io "$name" --type merge -p '{"metadata":{"finalizers":null}}'
              done
          echo "cluster esvaziado"

      # Ordem inversa da criação: primeiro o que roda dentro do cluster (o
      # NLB do ingress e os volumes EBS precisam sair antes da VPC).
      - name: destroy cluster-addons
        run: ./terraform/tf.sh cluster-addons "$ENVIRONMENT" destroy -auto-approve -no-color -lock-timeout=5m

      # O NLB é criado pelo ALB controller, fora do state. Se ele ainda
      # estiver na VPC, o destroy da infra falha com DependencyViolation.
      - name: aguardar os load balancers saírem da VPC
        if: env.VPC_ID != ''
        run: |
          for _ in $(seq 1 30); do
            N="$(aws elbv2 describe-load-balancers --region "$ENV_REGION" \
                  --query "length(LoadBalancers[?VpcId=='$VPC_ID'])" --output text)"
            [[ "$N" == "0" ]] && { echo "nenhum load balancer na VPC $VPC_ID"; exit 0; }
            echo "aguardando $N load balancer(s) saírem da VPC..."
            sleep 10
          done
          echo "::error::ainda há load balancer na VPC $VPC_ID. Apague-o e rode o destroy de novo."
          exit 1

      - name: destroy infra
        run: ./terraform/tf.sh infra "$ENVIRONMENT" destroy -auto-approve -no-color -lock-timeout=5m

      # Criado pelo openbao-bootstrap, fora do Terraform (cobra mesmo sem cluster).
      - name: apagar o segredo de init do OpenBao
        run: |
          ID="togglemaster/$ENVIRONMENT/openbao-init"
          if aws secretsmanager describe-secret --region "$ENV_REGION" --secret-id "$ID" >/dev/null 2>&1; then
            aws secretsmanager delete-secret --region "$ENV_REGION" --secret-id "$ID" \
              --force-delete-without-recovery >/dev/null
            echo "segredo $ID apagado"
          else
            echo "segredo $ID não existe"
          fi
