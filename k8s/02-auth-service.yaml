apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: togglemaster
  labels:
    app: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      # securityContext no nível do Pod: força uid/gid 1000 mesmo que a imagem
      # não declare USER. Sem isso, runAsNonRoot bloquearia o pod, porque os
      # Dockerfiles originais rodam como root.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: auth-service
          image: ${ECR_REGISTRY}/togglemaster/auth-service:${IMAGE_TAG}
          ports:
            - containerPort: 8001
              name: http
          env:
            - name: PORT
              value: "8001"
          envFrom:
            - secretRef:
                name: auth-service-secret
          resources:
            # Binário Go: consumo real fica em 10-20Mi. Request enxuto para
            # sobrar espaço para os pods que o HPA e o KEDA vão criar.
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # readOnlyRootFilesystem exige um volume gravável para /tmp.
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: togglemaster
spec:
  type: ClusterIP
  selector:
    app: auth-service
  ports:
    - port: 8001
      targetPort: 8001
      name: http
