# As rotas abaixo usam os caminhos REAIS de cada serviço, então não é preciso
# rewrite-target. Conferido no código-fonte:
#   auth-service       -> /validate, /admin/keys
#   flag-service       -> /flags
#   targeting-service  -> /rules
#   evaluation-service -> /evaluate
#
# O analytics-service não aparece aqui: ele não tem rota pública, só consome
# a fila SQS.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: togglemaster-ingress
  namespace: togglemaster
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /validate
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 8001
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 8001
          - path: /flags
            pathType: Prefix
            backend:
              service:
                name: flag-service
                port:
                  number: 8002
          - path: /rules
            pathType: Prefix
            backend:
              service:
                name: targeting-service
                port:
                  number: 8003
          - path: /evaluate
            pathType: Prefix
            backend:
              service:
                name: evaluation-service
                port:
                  number: 8004
